name: Expire idle Firebase rooms

# Rooms stay joinable after everyone leaves, so without this they would
# accumulate forever. Deletes rooms nobody has used for 30 days, matching the
# room service's expiry; see scripts/expire-rooms.mjs.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: expire-rooms
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No dependencies: the script signs its own token with node:crypto.
      - run: node scripts/expire-rooms.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          # Scheduled runs delete; manual runs preview unless told otherwise.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
