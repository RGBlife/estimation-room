name: Verify Firebase fallback
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx --yes firebase-tools@15.30.0 emulators:exec --project demo-scrum-poker --only auth,firestore,database 'npm run test:firebase'
      - run: npm run build:firebase
        env:
          VITE_FIREBASE_PROJECT_ID: demo-scrum-poker
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-scrum-poker.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://demo-scrum-poker-default-rtdb.firebaseio.com
          VITE_FIREBASE_APP_ID: 1:123456:web:demo
